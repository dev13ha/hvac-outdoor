[package]
name = "@hvace/outdoor"
version = "1.0.1"
edition = "2026"
description = "The outdoor package is the whole 24K unit. Geometry is Unit 24K.STEP. It depends on the fan motor and the compressor. The fan is a dependency of the fan motor, not of this unit directly."

[dependencies]
"@hvace/outdoor-fan-motor" = "@hvace/outdoor-fan-motor@^1.0"
"@hvace/outdoor-compressor" = "@hvace/outdoor-compressor@^1.0"

[[artifacts]]
name = "unit-geometry"
kind = "geometry"
format = "step"

[artifacts.semantic]
relation = "core:represents"
target = "os20:@hvace/outdoor"

[artifacts.source]
provider = "github"
repo = "dev13ha/hvac-outdoor"
revision = "1aac57431fd0d43dfeefc618363b3514933ccd9e"
path = "Unit 24K.STEP"

[[artifacts]]
name = "unit-model"
kind = "model"
format = "sysml"

[artifacts.semantic]
relation = "core:describes"
target = "os20:@hvace/outdoor"

[artifacts.source]
provider = "github"
repo = "dev13ha/hvac-outdoor"
revision = "1aac57431fd0d43dfeefc618363b3514933ccd9e"
path = "model/OutdoorUnit.sysml"

[[artifacts]]
name = "unit-behavior"
kind = "behavior"
format = "scxml"

[artifacts.semantic]
relation = "core:simulates"
target = "os20:@hvace/outdoor"

[artifacts.source]
provider = "github"
repo = "dev13ha/hvac-outdoor"
revision = "1aac57431fd0d43dfeefc618363b3514933ccd9e"
path = "behavior/OutdoorUnit.scxml"

[[artifacts]]
name = "unit-materials"
kind = "materials"
format = "toml"

[artifacts.semantic]
relation = "core:specifies"
target = "os20:@hvace/outdoor"

[artifacts.source]
provider = "github"
repo = "dev13ha/hvac-outdoor"
revision = "1aac57431fd0d43dfeefc618363b3514933ccd9e"
path = "materials/OutdoorUnit.toml"
